services:
  web:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - .:/app
      - tradingagents_data:/root/.tradingagents
    ports:
      - "3000:3000"
    command: ["sh", "-ec", "pip install --no-cache-dir -e . flask && exec python web_app.py"]
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=1
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  tradingagents_data:
